<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile 3D Voxel Engine</title>
    <style>
        /* CSS & DOM Overlay Setup for Mobile */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB; /* Sky Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none; /* Prevents browser scrolling/zooming on touch */
        }

        /* Center Target Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0px 0px 4px rgba(0,0,0,0.5);
        }

        /* Virtual Joystick (Left) */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        /* Action Buttons (Right) */
        .action-btn {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.5);
            color: black;
        }

        #btn-jump { bottom: 30px; right: 100px; }
        #btn-mine { bottom: 100px; right: 30px; }
        #btn-place { bottom: 30px; right: 20px; }

        /* Full Screen Touch Zone for looking around */
        #look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Mobile UI Overlays -->
    <div id="crosshair"></div>
    
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="look-zone"></div>

    <div id="btn-jump" class="action-btn">JUMP</div>
    <div id="btn-mine" class="action-btn">MINE</div>
    <div id="btn-place" class="action-btn">PLACE</div>

    <!-- Three.js (r128) Dependency -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Game Engine Script -->
    <script>
        // ----------------------------------------------------
        // 1. CORE THREE.JS SETUP
        // ----------------------------------------------------
        let camera, scene, renderer;
        let yawObject, pitchObject; // Custom FPS Camera Controller Objects
        let objects = []; 
        
        // Physics & Movement variables
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerHeight = 1.6;
        let canJump = false;

        // Mobile Controls Variables
        let moveX = 0; // Joystick X (-1 to 1)
        let moveY = 0; // Joystick Y (-1 to 1)
        let lookTouchId = null;
        let previousTouchX = 0;
        let previousTouchY = 0;

        init();
        animate();

        function init() {
            // Scene & Fog Configuration
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 40);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.5);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);

            // Camera & Custom FPS Controller Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            pitchObject = new THREE.Object3D();
            pitchObject.add(camera);

            yawObject = new THREE.Object3D();
            yawObject.position.set(0, 15, 0); // Spawn point
            yawObject.add(pitchObject);
            scene.add(yawObject);

            // ----------------------------------------------------
            // 2. PROCEDURAL MATERIALS & GEOMETRY
            // ----------------------------------------------------
            const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
            const dirtMat = new THREE.MeshLambertMaterial({ color: 0x6E4723 });
            const stoneMat = new THREE.MeshLambertMaterial({ color: 0x7A7A7A });
            const grassTopMat = new THREE.MeshLambertMaterial({ color: 0x557A2B });

            const grassMaterial = [
                dirtMat, dirtMat, grassTopMat, dirtMat, dirtMat, dirtMat
            ];

            // ----------------------------------------------------
            // 3. PROCEDURAL LANDSCAPE GENERATION
            // ----------------------------------------------------
            for (let x = -20; x <= 20; x++) {
                for (let z = -20; z <= 20; z++) {
                    let height = Math.floor(Math.sin(x / 5) * 3 + Math.cos(z / 4) * 2);
                    
                    for (let y = height - 4; y <= height; y++) {
                        let materialToUse = (y === height) ? grassMaterial : (y > height - 3) ? dirtMat : stoneMat;
                        const voxel = new THREE.Mesh(boxGeometry, materialToUse);
                        voxel.position.set(x, y, z);
                        voxel.castShadow = true;
                        voxel.receiveShadow = true;
                        scene.add(voxel);
                        objects.push(voxel);
                    }
                }
            }

            // ----------------------------------------------------
            // 4. PROCEDURAL PLAYER SKIN MODEL (NPC)
            // ----------------------------------------------------
            const npcGroup = new THREE.Group();
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xC58C66 });
            const shirtMat = new THREE.MeshLambertMaterial({ color: 0x00A8A8 });
            const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2C3E50 });

            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
            headMesh.position.y = 2.75;
            headMesh.castShadow = true;
            npcGroup.add(headMesh);

            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), shirtMat);
            torsoMesh.position.y = 2.125;
            torsoMesh.castShadow = true;
            npcGroup.add(torsoMesh);

            const legsMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), pantsMat);
            legsMesh.position.y = 1.375;
            legsMesh.castShadow = true;
            npcGroup.add(legsMesh);

            let npcBaseY = Math.floor(Math.sin(0 / 5) * 3 + Math.cos(-5 / 4) * 2);
            npcGroup.position.set(0, npcBaseY, -5);
            scene.add(npcGroup);

            // ----------------------------------------------------
            // 5. MOBILE TOUCH CONTROLS INTERFACE
            // ----------------------------------------------------
            setupMobileControls();

            // Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        // ----------------------------------------------------
        // 6. MOBILE TOUCH LOGIC SETUP
        // ----------------------------------------------------
        function setupMobileControls() {
            const joystickContainer = document.getElementById('joystick-container');
            const joystickKnob = document.getElementById('joystick-knob');
            const lookZone = document.getElementById('look-zone');
            
            let joystickTouchId = null;
            const maxJoyRadius = 60; // Max pixels knob can move

            // --- JOYSTICK LOGIC (Left screen) ---
            joystickContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            }, { passive: false });

            joystickContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        updateJoystick(e.changedTouches[i]);
                    }
                }
            }, { passive: false });

            const resetJoystick = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        joystickTouchId = null;
                        moveX = 0;
                        moveY = 0;
                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                    }
                }
            };
            joystickContainer.addEventListener('touchend', resetJoystick);
            joystickContainer.addEventListener('touchcancel', resetJoystick);

            function updateJoystick(touch) {
                const rect = joystickContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > maxJoyRadius) {
                    dx = (dx / distance) * maxJoyRadius;
                    dy = (dy / distance) * maxJoyRadius;
                }

                joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                
                // Map to -1.0 to 1.0 (Y is inverted for forward movement)
                moveX = dx / maxJoyRadius;
                moveY = dy / maxJoyRadius;
            }

            // --- LOOK LOGIC (Right screen) ---
            lookZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (lookTouchId === null) {
                    const touch = e.changedTouches[0];
                    lookTouchId = touch.identifier;
                    previousTouchX = touch.clientX;
                    previousTouchY = touch.clientY;
                }
            }, { passive: false });

            lookZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === lookTouchId) {
                        const deltaX = touch.clientX - previousTouchX;
                        const deltaY = touch.clientY - previousTouchY;
                        
                        // Apply rotation to custom FPS controller
                        yawObject.rotation.y -= deltaX * 0.005;
                        pitchObject.rotation.x -= deltaY * 0.005;
                        
                        // Clamp pitch to look straight up/down maximum
                        pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));

                        previousTouchX = touch.clientX;
                        previousTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            const resetLook = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };
            lookZone.addEventListener('touchend', resetLook);
            lookZone.addEventListener('touchcancel', resetLook);

            // --- ACTION BUTTONS ---
            const btnJump = document.getElementById('btn-jump');
            const btnMine = document.getElementById('btn-mine');
            const btnPlace = document.getElementById('btn-place');

            btnJump.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (canJump === true) velocity.y += 10.0;
                canJump = false;
            }, { passive: false });

            btnMine.addEventListener('touchstart', (e) => {
                e.preventDefault();
                performRaycastAction('mine');
            }, { passive: false });

            btnPlace.addEventListener('touchstart', (e) => {
                e.preventDefault();
                performRaycastAction('place');
            }, { passive: false });
        }

        // ----------------------------------------------------
        // 7. BLOCK BREAKING & PLACING LOGIC
        // ----------------------------------------------------
        function performRaycastAction(actionType) {
            const raycaster = new THREE.Raycaster();
            // Raycast exactly from center of screen (0, 0)
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Interaction limit (6 units)
                if (intersect.distance > 6) return;

                if (actionType === 'mine') {
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                } else if (actionType === 'place') {
                    // Create Grass block procedurally on place
                    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const dirtMat = new THREE.MeshLambertMaterial({ color: 0x6E4723 });
                    const grassTopMat = new THREE.MeshLambertMaterial({ color: 0x557A2B });
                    const grassMaterial = [dirtMat, dirtMat, grassTopMat, dirtMat, dirtMat, dirtMat];

                    const voxel = new THREE.Mesh(boxGeometry, grassMaterial);
                    voxel.position.copy(intersect.object.position).add(intersect.face.normal);
                    voxel.castShadow = true;
                    voxel.receiveShadow = true;
                    scene.add(voxel);
                    objects.push(voxel);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ----------------------------------------------------
        // 8. MAIN ANIMATION & PHYSICS LOOP
        // ----------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            let delta = (time - prevTime) / 1000;
            // Cap delta time to prevent clipping through world on lag spikes
            if (delta > 0.1) delta = 0.1; 

            // Damping/Friction
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            // Gravity Simulation
            velocity.y -= 9.8 * 5.0 * delta;

            // Movement logic derived from Virtual Joystick (-moveY is forward, moveX is right)
            direction.z = moveY;
            direction.x = moveX;
            direction.normalize();

            // Apply speed multipliers
            if (moveY !== 0) velocity.z -= direction.z * 40.0 * Math.abs(moveY) * delta;
            if (moveX !== 0) velocity.x += direction.x * 40.0 * Math.abs(moveX) * delta;

            // Floor Collision Detection via Downward Raycaster
            const currentPosition = yawObject.position.clone();
            const physicsRaycaster = new THREE.Raycaster(currentPosition, new THREE.Vector3(0, -1, 0), 0, playerHeight + 0.1);
            
            const intersections = physicsRaycaster.intersectObjects(objects);
            const onObject = intersections.length > 0;

            if (onObject && velocity.y < 0) {
                velocity.y = 0;
                canJump = true;
                yawObject.position.y = intersections[0].point.y + playerHeight;
            }

            // Apply calculated velocity relative to Camera Yaw rotation
            yawObject.translateX(velocity.x * delta);
            yawObject.translateZ(velocity.z * delta);
            yawObject.position.y += velocity.y * delta;

            // Fall-net Teleport System
            if (yawObject.position.y < -20) {
                velocity.y = 0;
                yawObject.position.set(0, 15, 0);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
